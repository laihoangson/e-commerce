name: ecom_intelligence
version: '1.0.0'
config-version: 2

profile: ecom_intelligence

model-paths: ["models"]
seed-paths:  ["seeds"]
test-paths:  ["tests"]

target-path: "target"
clean-targets: ["target", "dbt_packages"]

models:
  ecom_intelligence:
    bronze:
      +materialized: view        # Bronze = pass-through views over DuckDB tables
      +schema: bronze
    silver:
      +materialized: table
      +schema: silver
    gold:
      +materialized: table
      +schema: gold
