name: ecom_intelligence
version: '1.0.0'
config-version: 2

profile: ecom_intelligence

model-paths: ["models"]
seed-paths:  ["seeds"]
test-paths:  ["tests"]

target-path: "target"
clean-targets: ["target", "dbt_packages"]

models:
  ecom_intelligence:
    # Bronze is a SOURCE (loaded by ingest_bronze.py), not a dbt model folder.
    # No bronze config here — that was causing the unused path warning.
    silver:
      +materialized: table
      +schema: silver
    gold:
      +materialized: table
      +schema: gold