ecom_intelligence:
  target: dev
  outputs:

    # -- Local dev: fast, no internet needed
    dev:
      type: duckdb
      path: "{{ env_var('DUCKDB_PATH', '../data/ecom.duckdb') }}"
      threads: 4

    # -- Production: BigQuery (used by Render API + Looker Studio)
    prod:
      type: bigquery
      method: service-account
      project: "{{ env_var('GCP_PROJECT_ID') }}"
      dataset: ecom_gold
      keyfile: "{{ env_var('GOOGLE_APPLICATION_CREDENTIALS') }}"
      location: US
      threads: 4
      timeout_seconds: 300
      priority: interactive
