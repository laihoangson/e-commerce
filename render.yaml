# Render deployment for the RetailLens API.
#
# Connect this repo to Render as a Web Service, or use this blueprint.
# Set SUPABASE_DB_URL in the Render dashboard (use the Supabase POOLER
# connection string, port 6543, for serverless-friendly pooling).
#
# CORS_ORIGINS should be set to the GitHub Pages dashboard origin in production.

services:
  - type: web
    name: e-commerce-sn16
    runtime: python
    plan: free
    rootDir: api
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: SUPABASE_DB_URL
        sync: false
      - key: CORS_ORIGINS
        sync: false
      # Required for the ML serving / interpretation / monitoring endpoints to
      # download artifacts from Supabase Storage. Use the SERVICE key (the
      # artifacts bucket is private; the anon key cannot read it).
      - key: SUPABASE_URL
        sync: false
      - key: SUPABASE_SERVICE_KEY
        sync: false
      - key: SUPABASE_BUCKET
        sync: false
