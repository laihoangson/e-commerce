name: RetailLens pipeline

# Week 2: health check + bronze ingestion (live mode)
# W3+: will add silver transformation, gold marts, ML scoring

on:
  workflow_dispatch:
    inputs:
      ingest_mode:
        description: 'Ingestion mode'
        required: true
        default: 'live'
        type: choice
        options:
          - live
          - backfill
      num_events:
        description: 'Faker clickstream events to generate'
        required: true
        default: '2000'

  # Cron: every 6 hours
  # Enabled in W2 since we have real ingestion now
  schedule:
    - cron: '0 */6 * * *'

  push:
    branches: [main]
    paths:
      - 'pipeline/**'
      - 'requirements.txt'
      - '.github/workflows/pipeline.yml'

jobs:
  pipeline:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    env:
      SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
      SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
      SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
      SUPABASE_STORAGE_BUCKET: retaillens-artifacts
      GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
      KAGGLE_USERNAME: ${{ secrets.KAGGLE_USERNAME }}
      KAGGLE_KEY: ${{ secrets.KAGGLE_KEY }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.13'
          cache: 'pip'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Health check
        run: python pipeline/00_health_check.py

      - name: Bronze ingestion (live mode)
        # Manual workflow_dispatch uses input; cron + push use default 'live'
        run: |
          MODE="${{ github.event.inputs.ingest_mode || 'live' }}"
          NUM="${{ github.event.inputs.num_events || '2000' }}"
          echo "Running ingestion: mode=$MODE num_events=$NUM"
          python pipeline/01_ingest_bronze.py --mode "$MODE" --num-events "$NUM"

      - name: Report row counts
        if: success()
        run: |
          python -c "
          import duckdb
          con = duckdb.connect('data/retaillens.duckdb', read_only=True)
          tables = con.execute('''
              SELECT table_schema || '.' || table_name AS t
              FROM information_schema.tables
              WHERE table_schema = 'bronze'
              ORDER BY t
          ''').fetchall()
          print('Bronze layer:')
          for (t,) in tables:
              n = con.execute(f'SELECT COUNT(*) FROM {t}').fetchone()[0]
              print(f'  {t}: {n:,} rows')
          "

      - name: Upload logs on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: pipeline-logs
          path: |
            *.log
            data/*.duckdb
          retention-days: 7