name: pipeline

on:
  push:
    branches: [main]
  workflow_dispatch: {}
  schedule:
    # Daily at 06:00 UTC: generate today's live orders and refresh the pipeline.
    - cron: "0 6 * * *"

jobs:
  health-check:
    runs-on: ubuntu-latest
    # Health check on push and manual runs; the daily data job handles schedule.
    if: github.event_name != 'schedule'
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run health check
        working-directory: pipeline
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
          SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
          SUPABASE_DB_URL: ${{ secrets.SUPABASE_DB_URL }}
          SUPABASE_BUCKET: ${{ secrets.SUPABASE_BUCKET }}
        run: python 00_health_check.py

  daily-live:
    runs-on: ubuntu-latest
    # Only on the daily schedule or manual dispatch.
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run daily live pipeline
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
          SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
          SUPABASE_DB_URL: ${{ secrets.SUPABASE_DB_URL }}
          SUPABASE_BUCKET: ${{ secrets.SUPABASE_BUCKET }}
          DUCKDB_PATH: ${{ github.workspace }}/data/retaillens.duckdb
        run: python pipeline/run_daily_live.py
